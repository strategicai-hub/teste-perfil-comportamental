<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da empresa — Strategic AI</title>
  <link rel="icon" type="image/png" href="{{ base_path }}/assets/favicon-sai.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm rounded-xl border border-slate-200 bg-white shadow-sm p-6 space-y-4">
    <div class="flex items-center gap-2">
      <img src="{{ base_path }}/assets/favicon-sai.png" alt="Strategic AI" class="h-8 w-auto">
      <span class="font-semibold">Painel da empresa</span>
    </div>
    <h1 class="text-xl font-semibold">Acesso do gestor</h1>
    <p class="text-sm text-slate-500">Veja o resultado do COPSOQ II da sua organização, por área e no geral.</p>
    {% if error %}<p class="text-sm text-red-600">{{ error }}</p>{% endif %}
    <form method="POST" action="{{ base_path }}/empresa/login" class="space-y-4">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="email">E-mail</label>
        <input id="email" name="email" type="email" required autofocus
               class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:border-teal-600 focus:outline-none focus:ring-1 focus:ring-teal-600">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="password">Senha</label>
        <div class="relative">
          <input id="password" name="password" type="password" required
                 class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 pr-10 text-sm focus:border-teal-600 focus:outline-none focus:ring-1 focus:ring-teal-600">
          <button type="button" onclick="togglePw(this)" aria-label="Mostrar senha" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600">
            <svg data-eye xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <svg data-eye-off class="hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
          </button>
        </div>
      </div>
      <button class="w-full rounded-md bg-teal-700 hover:bg-teal-800 px-3 py-2 text-sm font-medium text-white">Entrar</button>
    </form>
  </div>
  <script>
    function togglePw(btn) {
      var input = btn.parentElement.querySelector('input');
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.querySelector('[data-eye]').classList.toggle('hidden', show);
      btn.querySelector('[data-eye-off]').classList.toggle('hidden', !show);
      btn.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
    }
  </script>
</body>
</html>
