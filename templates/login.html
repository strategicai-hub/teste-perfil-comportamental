{% extends "_auth.html" %}
{% block title %}Entrar — Strategic AI{% endblock %}
{% block card %}
  <h1 class="text-xl font-semibold text-slate-900">Entrar</h1>
  {% if error %}<p class="text-sm text-red-600">{{ error }}</p>{% endif %}
  <form method="POST" action="{{ base_path }}/entrar" class="space-y-4">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <div>
      <label class="label" for="email">E-mail</label>
      <input id="email" name="email" type="email" required value="{{ email or '' }}" class="input" autofocus>
    </div>
    <div>
      <label class="label" for="senha">Senha</label>
      {{ pwfield('password', 'senha') }}
    </div>
    <button type="submit" class="btn-primary w-full">Entrar</button>
    <div class="text-center pt-1">
      <a href="{{ base_path }}/esqueci-senha" class="text-sm text-teal-700 hover:text-teal-900">Esqueci minha senha</a>
    </div>
  </form>
{% endblock %}
